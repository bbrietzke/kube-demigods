apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
patches:
- target:
    kind: IPAddressPool
    name: primary-pool
  patch: |-
    - op: replace
      path: /spec/addresses/0
      value: "192.168.5.60-192.168.5.62"
- target:
    kind: BGPAdvertisement
    name: bgpadvert
  patch: |-
    - op: replace
      path: /spec/ipAddressPools/0
      value: "primary-pool"
- target:
    kind: L2Advertisement
    name: l2advert-primary
  patch: |-
    - op: replace
      path: /spec/ipAddressPools/0
      value: "primary-pool"