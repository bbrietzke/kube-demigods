# Forgejo on the demigods cluster: forgejo-helm chart 17.3.3, Forgejo 15.0.12 (LTS, supported until
# 2027-07-15; the chart's default rootless image, multi-arch incl. arm64).
#
# Web UI: HTTPRoute on traefik-gateway (TLS + HTTP->HTTPS redirect at the Gateway).
# Git over SSH: its own MetalLB IP, 192.168.5.61:22.
# Database: the "forgejo" database in CloudNativePG cluster00 (DatabaseRole + Database in base/).
# No Redis: memory cache, sessions in the database, LevelDB queue (single replica).

replicaCount: 1          # Forgejo is not HA; the chart requires 1 with an RWO volume
strategy:
  type: Recreate

persistence:
  enabled: true
  size: 20Gi
  storageClass: rook-ceph
  accessModes: [ReadWriteOnce]

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - git.faultycloud.app
  port: 3000

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: LoadBalancer
    port: 22
    annotations:
      # Fixed address from MetalLB's primary-pool (192.168.5.60-62; .60 is Traefik).
      metallb.io/loadBalancerIPs: 192.168.5.61

gitea:
  admin:
    # username/password/email from the forgejo-admin Secret (generated by `make prerequisites`).
    existingSecret: forgejo-admin
    # The chart reads only username/password from the Secret; the email is a plain value.
    email: forgejo-admin@faultycloud.app
    # Create the admin once and never reset it, so a password changed in the UI sticks.
    passwordMode: initialOnlyNoReset

  # Database password from the forgejo-database Secret (same value as the CNPG role's Secret).
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-database
          key: password

  config:
    APP_NAME: Forgejo (demigods)
    server:
      DOMAIN: git.faultycloud.app
      ROOT_URL: https://git.faultycloud.app/
      PROTOCOL: http           # TLS ends at the Gateway
      SSH_DOMAIN: git.faultycloud.app
      SSH_PORT: 22             # what clone URLs show (the LoadBalancer port)
      SSH_LISTEN_PORT: 2222    # what the rootless container listens on
    database:
      DB_TYPE: postgres
      HOST: cluster00-rw.db.svc:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: require
      # cluster00 is shared (100 connections in total).
      MAX_OPEN_CONNS: 10
      MAX_IDLE_CONNS: 2
    cache:
      ADAPTER: memory
    session:
      PROVIDER: db
    queue:
      TYPE: level
    service:
      DISABLE_REGISTRATION: true       # accounts are created by the admin only
      REQUIRE_SIGNIN_VIEW: false
    packages:
      ENABLED: false                   # container images go to Harbor
    actions:
      ENABLED: true
      # `uses: actions/checkout@v4` etc. resolve against Forgejo's mirror of common actions.
      DEFAULT_ACTIONS_URL: https://data.forgejo.org
    mirror:
      ENABLED: true
      DEFAULT_INTERVAL: 1h             # GitHub pull mirrors sync hourly by default
      MIN_INTERVAL: 10m
    migrations:
      # Pull mirrors / migrations only from GitHub.
      ALLOWED_DOMAINS: github.com,*.github.com,*.githubusercontent.com
